[project]
name = "pulseq-analysis"
version = "0.1.0rc6"
description = "Derived values of a Pulseq sequence: the block table, gradient peaks, SAFE PNS and the gradient spectrum"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
]

# pypulseq is optional: no module of the package imports it. `load(seq)` and `read_pypulseq`
# take a `pypulseq.Sequence`, which only a caller with pypulseq has.
[project.optional-dependencies]
pypulseq = ["pypulseq>=1.5.0"]

# The analyses of this package (`pulseq_analysis.analyses.registry`): the name of an entry point
# is the ID of the analysis.
[project.entry-points."pulseq_analysis.analyses"]
"seq.index" = "pulseq_analysis.analyses.registry:SEQ_INDEX"
"gradient.peaks" = "pulseq_analysis.analyses.registry:GRADIENT_PEAKS"
"gradient.blocks" = "pulseq_analysis.analyses.registry:GRADIENT_BLOCKS"
"pns.safe.levels" = "pulseq_analysis.analyses.registry:PNS_SAFE_LEVELS"
"gradient.spectrum" = "pulseq_analysis.analyses.registry:GRADIENT_SPECTRUM"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulseq_analysis"]

[dependency-groups]
dev = [
    "import-linter",
    "pypulseq",
    "pytest",
    "ruff",
]

# pypulseq for the tests and the scripts (the `dev` group) and for the extra: 1.5.0.post1 with six
# commits, from the fork (tag pulseq-reports-pin-2, branch pulseq-reports-pin): the SAFE PNS
# filter as a recursion, calc_pns in chunks, the get_block fix for oversampled arbitrary
# gradients (upstream PR #424), the read fix of upstream #359, the [SIGNATURE] hash read as text
# (Sequence/read_seq.py:97; it was a float when the hex digest looked like a number), and
# signature_file 'text' after read (upstream PR #428). TODO.md ("Move from the pypulseq fork to a
# pypulseq release") lists them. The tests stay on the fork: its chunked calc_pns makes them much
# faster than with the release.
# uv also applies this source for a project that depends on pulseq-analysis by git URL; pip
# does not.
[tool.uv.sources]
pypulseq = { git = "https://github.com/mdtisdall/pypulseq", rev = "3c3bd8515e591ef859399aa20db64b1bd2c3a725" }

# The layers of docs/plans/parser-redesign.md, section 7.1: a layer imports only from the layers
# below it. `scripts/check` runs `lint-imports`.
[tool.importlinter]
root_package = "pulseq_analysis"

[[tool.importlinter.contracts]]
name = "The analyses, the waveforms, the files and the base, in layers"
type = "layers"
containers = ["pulseq_analysis"]
layers = [
    "analyses",
    "synth",
    "seqfile",
    "_equality : _validate",
]
exhaustive = true

[tool.ruff]
line-length = 100
extend-exclude = [".worktrees"]

# pypulseq is optional (`[project.optional-dependencies]`): the package must not import it.
# TID251 bans any import of it, TID253 an import at the top of a module. The tests and the
# scripts run with the `dev` group, which has it; a test module that needs it has the `pypulseq`
# marker. `seqfile/from_pypulseq.py` may import it in a function.
[tool.ruff.lint]
extend-select = ["TID251", "TID253"]

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["pypulseq"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pypulseq".msg = "pypulseq is an optional dependency of pulseq-analysis"

[tool.ruff.lint.per-file-ignores]
# E402: a test module that needs pypulseq calls `pytest.importorskip("pypulseq")` before its
# other imports.
"tests/**" = ["TID251", "TID253", "E402"]
"packages/*/tests/**" = ["TID251", "TID253"]
"scripts/**" = ["TID251", "TID253"]
"src/pulseq_analysis/seqfile/from_pypulseq.py" = ["TID251"]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = [
    "pypulseq: needs pypulseq; scripts/check also runs the tests without pypulseq, with -m 'not pypulseq'",
    "cpp_oracle: needs pulseq-cpp-oracle on the PATH (the Nix devShell); skipped without it",
]
