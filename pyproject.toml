[project]
name = "pulseq-analysis"
version = "0.1.0"
description = "Analysis of Pulseq sequences"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulseq_analysis"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
extend-exclude = [".worktrees"]
