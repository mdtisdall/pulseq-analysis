[project]
name = "pulseq-analysis"
version = "0.1.0rc6"
description = "Derived values of a Pulseq sequence: the block table, gradient peaks, SAFE PNS and the gradient spectrum"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pypulseq>=1.5.0.post1",
    "numpy",
    "scipy",
]

# The cpp-siemens interpreter (`interpreter="cpp-siemens"`, by name) runs the C++ reader through
# the package pulseq-cpp-siemens, which has compiled wheels. Without this extra, the package reads
# files only through the `spec` interpreter, the default, and `cpp-siemens` raises ImportError.
[project.optional-dependencies]
cpp-siemens = ["pulseq-cpp-siemens"]

# The analyses of this package (`pulseq_analysis.analyses.registry`): the name of an entry point
# is the ID of the analysis.
[project.entry-points."pulseq_analysis.analyses"]
"seq.index" = "pulseq_analysis.analyses.registry:SEQ_INDEX"
"gradient.peaks" = "pulseq_analysis.analyses.registry:GRADIENT_PEAKS"
"gradient.blocks" = "pulseq_analysis.analyses.registry:GRADIENT_BLOCKS"
"pns.safe.levels" = "pulseq_analysis.analyses.registry:PNS_SAFE_LEVELS"
"gradient.spectrum" = "pulseq_analysis.analyses.registry:GRADIENT_SPECTRUM"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulseq_analysis"]

[dependency-groups]
dev = [
    "import-linter",
    "pulseq-cpp-siemens",
    "pytest",
    "ruff",
]

# pypulseq 1.5.0.post1 with six commits, from the fork (tag pulseq-reports-pin-2, branch
# pulseq-reports-pin): the SAFE PNS filter as a recursion, calc_pns in chunks, the
# get_block fix for oversampled arbitrary gradients (upstream PR #424), the read fix of
# upstream #359, the [SIGNATURE] hash read as text (pypulseq-issues 09), and
# signature_file 'text' after read (upstream PR #428). TODO.md ("Move from the pypulseq
# fork to a pypulseq release") lists them.
# uv also applies this source for a project that depends on pulseq-analysis by git URL; pip
# does not.
[tool.uv.sources]
# pulseq-cpp-siemens from this repository, built from source (a C++ compiler; CMake fetches the
# reader's files, unless PULSEQ_SOURCE_DIR names them). uv applies this source also to a project
# that depends on pulseq-analysis by git URL: it builds the package from the same commit. How a
# release gets it (wheels from an index, or this source) is decided at release time.
pulseq-cpp-siemens = { path = "packages/pulseq-cpp-siemens" }
pypulseq = { git = "https://github.com/mdtisdall/pypulseq", rev = "3c3bd8515e591ef859399aa20db64b1bd2c3a725" }

# The layers of docs/plans/parser-redesign.md, section 7.1: a layer imports only from the layers
# below it. `scripts/check` runs `lint-imports`.
[tool.importlinter]
root_package = "pulseq_analysis"

[[tool.importlinter.contracts]]
name = "The analyses, the waveforms, the files and the base, in layers"
type = "layers"
containers = ["pulseq_analysis"]
layers = [
    "analyses",
    "synth",
    "seqfile",
    "_equality : _validate",
]
exhaustive = true

[tool.ruff]
line-length = 100
extend-exclude = [".worktrees"]
