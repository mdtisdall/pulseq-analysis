[project]
name = "pulseq-analysis"
version = "0.1.0rc2"
description = "Derived values of a Pulseq sequence: waveforms, PNS and gradient summaries"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pypulseq>=1.5.0.post1",
    "numpy",
]

# The analyses of this package (`pulseq_analysis.analyses`): the name of an entry point is the
# ID of the analysis.
[project.entry-points."pulseq_analysis.analyses"]
"seq.index" = "pulseq_analysis.analyses:SEQ_INDEX"
"gradient.limits" = "pulseq_analysis.analyses:GRADIENT_LIMITS"
"gradient.blocks" = "pulseq_analysis.analyses:GRADIENT_BLOCKS"
"pns.safe.levels" = "pulseq_analysis.analyses:PNS_SAFE_LEVELS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulseq_analysis"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "scipy",
]

# pypulseq 1.5.0.post1 with four commits, from the fork (tag pulseq-reports-pin-1, branch
# pulseq-reports-pin): the SAFE PNS filter as a recursion, calculate_pns in chunks, the
# get_block fix for oversampled arbitrary gradients (upstream PR #424), and the read fix of
# upstream #359. TODO.md ("Move from the pypulseq fork to a pypulseq release") lists them.
# uv also applies this source for a project that depends on pulseq-analysis by git URL; pip
# does not.
[tool.uv.sources]
pypulseq = { git = "https://github.com/mdtisdall/pypulseq", rev = "a74ab06e51ca09707ff54837cf5ff652f6e69e94" }

[tool.ruff]
line-length = 100
extend-exclude = [".worktrees"]
