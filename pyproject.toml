[project]
name = "pulseq-analysis"
version = "0.1.0rc6"
description = "Derived values of a Pulseq sequence: the block table, gradient peaks, SAFE PNS and the gradient spectrum"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pypulseq>=1.5.0.post1",
    "numpy",
    "scipy",
]

# The analyses of this package (`pulseq_analysis.analyses`): the name of an entry point is the
# ID of the analysis.
[project.entry-points."pulseq_analysis.analyses"]
"seq.index" = "pulseq_analysis.analyses:SEQ_INDEX"
"gradient.peaks" = "pulseq_analysis.analyses:GRADIENT_PEAKS"
"gradient.blocks" = "pulseq_analysis.analyses:GRADIENT_BLOCKS"
"pns.safe.levels" = "pulseq_analysis.analyses:PNS_SAFE_LEVELS"
"gradient.spectrum" = "pulseq_analysis.analyses:GRADIENT_SPECTRUM"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulseq_analysis"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# pypulseq 1.5.0.post1 with six commits, from the fork (tag pulseq-reports-pin-2, branch
# pulseq-reports-pin): the SAFE PNS filter as a recursion, calc_pns in chunks, the
# get_block fix for oversampled arbitrary gradients (upstream PR #424), the read fix of
# upstream #359, the [SIGNATURE] hash read as text (pypulseq-issues 09), and
# signature_file 'text' after read (upstream PR #428). TODO.md ("Move from the pypulseq
# fork to a pypulseq release") lists them.
# uv also applies this source for a project that depends on pulseq-analysis by git URL; pip
# does not.
[tool.uv.sources]
pypulseq = { git = "https://github.com/mdtisdall/pypulseq", rev = "3c3bd8515e591ef859399aa20db64b1bd2c3a725" }

[tool.ruff]
line-length = 100
extend-exclude = [".worktrees"]
